services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_started
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - app_public:/app:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: construtor-pg/php-runtime:local
    depends_on:
      database:
        condition: service_healthy
    environment: &app_environment
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change-this-secret}
      APP_SHARE_DIR: /srv/app-state/share
      APP_INSTALLATION_SESSION_FILE: /srv/app-state/install/activation-session.json
      APP_INSTALLATION_SESSION_REQUIRED: ${APP_INSTALLATION_SESSION_REQUIRED:-1}
      APP_INSTALLATION_SESSION_SIGNING_KEY: ${APP_INSTALLATION_SESSION_SIGNING_KEY:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-ChangeMe_123}@database:5432/${POSTGRES_DB:-construtor_pg}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async&auto_setup=0
      MAILER_DSN: ${MAILER_DSN:-null://null}
    volumes:
      - app_public:/app
      - app_state:/srv/app-state
      - ./backend/var/install:/srv/app-state/install
    restart: unless-stopped

  worker:
    image: construtor-pg/php-runtime:local
    depends_on:
      php:
        condition: service_started
      database:
        condition: service_healthy
    environment:
      <<: *app_environment
      APP_WORKER_ENABLED: ${APP_WORKER_ENABLED:-0}
    volumes:
      - app_public:/app
      - app_state:/srv/app-state
      - ./backend/var/install:/srv/app-state/install
    command: ["sh", "-lc", "if printenv APP_WORKER_ENABLED | grep -qx 1; then php /app/backend/bin/console messenger:consume async -vv --time-limit=3600; else tail -f /dev/null; fi"]
    restart: unless-stopped

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construtor_pg}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_123}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-construtor_pg}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    restart: unless-stopped

volumes:
  app_public:
  app_state:
  database_data:
