<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin documentos regulados</title>
  <link rel="stylesheet" href="../../kendo/styles/default-urban.css">
  <link rel="stylesheet" href="../../src/styles/crud-engine.css">
  <link rel="stylesheet" href="../../src/styles/program-builder.css">
</head>
<body>
  <main id="regulated-document-admin-root" class="program-builder-root"></main>
  <section style="margin:16px;padding:12px 14px;border:1px solid #d6dde6;border-radius:6px;background:#f7f9fb;color:#1f2937;">
    <strong>Trilha concreta priorizada:</strong> fiscal.
  </section>
  <script src="../../vendor/jquery/jquery-4.0.0.min.js"></script>
  <script src="../../kendo/js/kendo.all.min.js"></script>
  <script src="../../kendo/kendo-license.js"></script>
  <script src="../../kendo/js/cultures/kendo.culture.pt-BR.min.js"></script>
  <script src="../../kendo/js/messages/kendo.messages.pt-BR.min.js"></script>
  <script src="../../src/bootstrap/kendo-ptbr.js"></script>
  <script src="../../src/crud-engine/CrudUtils.js"></script>
  <script src="../../src/crud-engine/CrudHttpClient.js"></script>
  <script src="../../src/demo/DemoMockHttpClient.js"></script>
  <script src="../../src/regulated-document-admin/regulated-document-admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const admin = new window.RegulatedDocumentAdmin({
        root: "#regulated-document-admin-root",
        httpClient: new window.DemoMockHttpClient()
      });
      admin.init();
      window.currentRegulatedDocumentAdmin = admin;
    });
  </script>
</body>
</html>
