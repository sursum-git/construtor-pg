<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatorio de Processamento</title>
  <style>
    body {
      margin: 0;
      background: #f4f5f7;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      max-width: 900px;
      gap: 16px;
      margin: 0 auto;
      padding: 24px;
    }

    section {
      border: 1px solid #d9dee7;
      border-radius: 6px;
      background: #fff;
      padding: 18px;
    }

    h1,
    h2 {
      margin: 0 0 8px;
      color: #0f4f8f;
    }

    p {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Relatorio de Processamento</h1>
      <p>Pagina demonstrativa aberta como retorno do processamento. Em producao este endereco seria resolvido pelo backend.</p>
    </section>
    <section>
      <h2>Resumo</h2>
      <p>Clientes processados conforme os parametros informados na tela anterior.</p>
    </section>
  </main>
</body>
</html>
